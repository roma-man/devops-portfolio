server {
    listen 80;

    server_name opsforge.website www.opsforge.website;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://opsforge.website$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name opsforge.website www.opsforge.website;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/opsforge.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsforge.website/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://app:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
